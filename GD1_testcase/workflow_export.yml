            NHIỆM VỤ:

            PHẦN A - Liệt kê Business Rules, phân loại:

            Functional | Validation | Constraint | Dependency | Hidden

            Mỗi rule ghi: ID | Loại | Mô tả | Trace về step/AC nào


            PHẦN B - Với mỗi AC và BR, đánh giá rủi ro:

            - Likelihood (High/Medium/Low): khả năng khâu này bị lỗi

            - Impact (High/Medium/Low): mức nghiêm trọng nếu lỗi

            - Risk Level: cả hai cao --> High; cả hai thấp --> Low; còn lại Medium

            - BẮT BUỘC ghi LÝ DO đánh giá


            RÀNG BUỘC:

            - Rule nào là SUY LUẬN của bạn --> đánh dấu [SUY LUẬN]

            - KHÔNG bịa rule không có căn cứ trong tài liệu

            - Điểm mơ hồ đã phát hiện --> coi là yếu tố TĂNG Likelihood


