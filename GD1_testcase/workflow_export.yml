            4. PRIORITY      - priority nào gán không hợp lý so với risk?

            5. QUALITY       - Expected Result nào CHƯA ĐO ĐƯỢC?


            Với mỗi vấn đề: nêu ID cụ thể + giải thích + đề xuất sửa.

            Nhóm nào không có vấn đề -> ghi "Khong phat hien van de".

            TUYỆT ĐỐI không bịa vấn đề cho đủ số lượng.


            CUỐI CÙNG:

            - Bảng Traceability: | AC/BR | Test Case ID | COVERED hay GAP |

            - Tự chấm 1-10 cho chất lượng bộ test case

            - Nêu 3 vấn đề nghiêm trọng nhất'
