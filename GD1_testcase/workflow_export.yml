        - default: '# Test Case Format


            The generated test cases MUST follow the structure below.


            ## Test Case Fields


            Each test case must contain the following fields:


            ### 1. ID

            - Unique identifier of the test case.

            - Format: `[UC-ID]-TC-[number]`

            - Example: `[UC20]-TC-001`

            - The number must be sequential.


            ### 2. Test Case Title

            - Short and clear description of what is being verified.

            - Should describe one test objective.

            - Prefer the format: "Verify + expected behavior/condition".


            ### 3. PreCondition

            - Conditions that must be satisfied before executing the test case.

            - Include required user role, system state, existing data, or navigation
            state when applicable.

            - Do not include test steps in this field.


            ### 4. Test Case Description

            - Describe the test execution steps.

            - Steps must be numbered sequentially.

            - Each step should contain one clear action.

            - Include test data when required.

            - Do not put expected results in the test steps.


            ### 5. Expected Output

            - Describe the expected system behavior after executing the test steps.

            - Expected results must be specific, observable, and traceable to the
            requirement or business rule.

            - Do not introduce behavior that is not supported by the Use Case.


            ## Execution Fields


            The following fields are reserved for Test Execution and MUST remain empty
            during Test Case Generation:


            ### 6. Result

            Possible values:

            - Passed

            - Failed

            - N/A

            - Untested


            Default value for newly generated test cases:

            `Untested`


            ### 7. Test date

            - Leave empty during Test Case Generation.

            - Filled in during Manual Test Execution.


            ### 8. Note

            - Leave empty unless there is a known note or reference.

            - Bug IDs may be added during Test Execution when a test case fails.


            ## Output Format


            For every test case, use the following structure:


            | ID | Test Case Title | PreCondition | Test Case Description | Expected
            Output | Result | Test date | Note |

            |---|---|---|---|---|---|---|---|

            | [UC-ID]-TC-001 | ... | ... | 1. ...<br>2. ... | ... | Untested | | |


            ## Generation Rules


            1. Generate test cases based only on the provided Use Case, Business Rules,
            Risk Analysis, and Test Conditions.

            2. Do not invent requirements or business rules.

            3. Each test case must have a single clear test objective.

            4. Every test condition must be covered by at least one test case.

            5. Include positive and negative cases when supported by the requirements.

            6. Avoid duplicate test cases.

            7. Keep test cases independent where possible.

            8. Use clear, executable test steps.

            9. Expected Output must be objectively verifiable.

            10. Follow the exact field structure above.'
